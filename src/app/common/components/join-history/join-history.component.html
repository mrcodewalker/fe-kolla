<div class="join-history-container p-4">
  <!-- Header Section -->
  <div class="header-section">
    <div class="flex justify-content-between align-items-center mb-4">
      <div class="flex align-items-center gap-3">
        <div>
          <h3 class="m-0 title">Lịch sử tham gia họp</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Section -->
  <div class="search-section mb-3">
    <div class="card search-card">
      <div class="card-body p-4">
        <form [formGroup]="form" (ngSubmit)="onSearch()">
          <div class="search-row">
            <!-- Join Date Field -->
            <div class="field-group">
              <label for="joinAt" class="field-label">
                <span>Ngày vào</span>
              </label>
              <div class="input-container">
                <p-calendar
                  id="joinAt"
                  formControlName="joinAt"
                  [showTime]="false"
                  dateFormat="dd/mm/yy"
                  placeholder="Chọn ngày vào"
                  [showIcon]="true"
                  [iconDisplay]="'input'"
                  icon="pi pi-calendar"
                  [appendTo]="'body'"
                  [touchUI]="false"
                  [readonlyInput]="false"
                  styleClass="input-field date-field"
                >
                </p-calendar>
              </div>
            </div>

            <!-- Leave Date Field -->
            <div class="field-group">
              <label for="leaveAt" class="field-label">
                <span>Ngày ra</span>
              </label>
              <div class="input-container">
                <p-calendar
                  id="leaveAt"
                  formControlName="leaveAt"
                  [showTime]="false"
                  dateFormat="dd/mm/yy"
                  placeholder="Chọn ngày ra"
                  [showIcon]="true"
                  [iconDisplay]="'input'"
                  icon="pi pi-calendar"
                  [appendTo]="'body'"
                  [touchUI]="false"
                  [readonlyInput]="false"
                  styleClass="input-field date-field"
                >
                </p-calendar>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="actions-group">
              <button
                pButton
                type="button"
                label="Làm mới"
                [disabled]="loading"
                class="p-button-outlined p-button-secondary btn-action"
                [style]="{
                  'font-weight': '700 !important',
                  'font-size': '0.875rem !important',
                  'font-style': 'normal'
                }"
                (click)="onClear()"
              ></button>
              <button
                pButton
                label="Tìm kiếm"
                type="submit"
                [disabled]="loading"
                [loading]="loading"
                loadingIcon="pi pi-spin pi-spinner"
                [style]="{
                  'font-weight': '700 !important',
                  'font-size': '0.875rem !important',
                  'font-style': 'normal'
                }"
                class="p-button-primary btn-action"
              ></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Column Settings Section -->
  <div class="column-settings-section mb-3">
    <div class="flex justify-content-end">
      <button
        pButton
        type="button"
        icon="pi pi-cog"
        label="Tùy chỉnh hiển thị cột"
        class="p-button-outlined p-button-info"
        [style]="{ 'font-weight': '600', 'border-radius': '8px' }"
        (click)="showColumnSelector = true"
      ></button>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-wrapper">
    <app-data-table
      [data]="rows"
      [columns]="displayedColumns"
      [loading]="loading"
      [paginator]="true"
      [paginatorPosition]="'top'"
      [rows]="size"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 25, 50]"
      [globalFilterFields]="globalFilterFields"
      (onPage)="onPageChange($event)"
      (onSort)="onSortChange($event)"
    >
    </app-data-table>
  </div>

  <!-- Column Selector Dialog -->
  <p-dialog
    [(visible)]="showColumnSelector"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="column-selector-dialog rounded-dialog"
    [showHeader]="true"
    header="Tùy chỉnh hiển thị cột"
    [style]="{
      width: '480px',
      'max-width': '90vw',
      'border-radius': '12px !important',
      border: '2px solid #9ca3af !important',
      overflow: 'hidden'
    }"
  >
    <div class="column-selector-content">
      <div class="column-options-header mb-3">
        <h4 class="mb-2" style="color: #0e7490; font-weight: 600">
          <i class="pi pi-list mr-2" style="color: #06b6d4"></i>
          Hiển thị tất cả
        </h4>
        <p class="text-sm text-secondary mb-0">
          Chọn các cột bạn muốn hiển thị trên bảng dữ liệu
        </p>
      </div>

      <div class="column-options-grid">
        <div
          *ngFor="let column of columnConfig"
          class="column-option-card"
          [class.disabled]="column.alwaysVisible"
          (click)="!column.alwaysVisible && toggleColumnVisibility(column)"
        >
          <div class="column-option-content">
            <div class="column-icon">
              <i
                class="pi pi-circle"
                [class.pi-check-circle]="column.visible"
                [style.color]="column.visible ? '#06b6d4' : '#94a3b8'"
              ></i>
            </div>
            <div class="column-info">
              <span class="column-header">{{ column.header }}</span>
            </div>
          </div>
        </div>
      </div>

      <div
        class="column-actions mt-4 pt-3"
        style="border-top: 1px solid #e5e7eb"
      >
        <div class="flex justify-content-between align-items-center gap-3">
          <button
            pButton
            type="button"
            label="Đặt lại mặc định"
            class="p-button-outlined dialog-action-btn"
            [style]="{
              'font-weight': '600',
              'border-radius': '6px',
              flex: '1'
            }"
            (click)="resetColumnVisibility()"
          ></button>
          <button
            pButton
            type="button"
            label="Thoát"
            class="p-button-outlined dialog-action-btn"
            [style]="{
              'font-weight': '600',
              'border-radius': '6px',
              flex: '1'
            }"
            (click)="showColumnSelector = false"
          ></button>
        </div>
      </div>
    </div>
  </p-dialog>

  <!-- Loading Dialog -->
  <!-- <p-dialog
    [(visible)]="loading"
    [modal]="true"
    [closable]="false"
    [draggable]="false"
    [resizable]="false"
    styleClass="loading-dialog"
    [showHeader]="false"
  >
    <div class="loading-content">
      <div class="loading-spinner">
        <i
          class="pi pi-spin pi-spinner"
          style="font-size: 2rem; color: #3498db"
        ></i>
      </div>
      <div class="loading-text">
        <h4>Đang tìm kiếm...</h4>
        <p>Vui lòng chờ trong giây lát</p>
      </div>
    </div>
  </p-dialog> -->
</div>
