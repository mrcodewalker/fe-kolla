<!-- Modal Overlay -->
<div *ngIf="showDialog" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50 animate-fade-in" (click)="onOverlayClick()">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform animate-modal-in" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="border-b px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-cyan-100 rounded-lg flex items-center justify-center">
          <i class="pi pi-question-circle text-cyan-600 text-lg"></i>
        </div>
        <div>
          <h2 class="text-lg font-semibold text-gray-800">{{ title }}</h2>
        </div>
      </div>
      <button (click)="closeDialog()" class="text-gray-400 hover:text-gray-600 transition-colors p-1">
        <i class="pi pi-times text-xl"></i>
      </button>
    </div>
    
    <!-- Content -->
    <div class="p-6">
      <p class="text-sm text-gray-700 mb-6">{{ message }}</p>

      <!-- Action Buttons -->
      <div class="flex gap-3 justify-end">
        <button 
          type="button" 
          class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
          (click)="onCancel()">
          <i class="pi pi-times text-sm"></i>
          <span>{{ cancelText }}</span>
        </button>
        
        <button 
          type="button" 
          class="px-4 py-2 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
          [ngClass]="confirmButtonClass"
          (click)="onConfirm()">
          <i class="pi pi-check text-sm"></i>
          <span>{{ confirmText }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
