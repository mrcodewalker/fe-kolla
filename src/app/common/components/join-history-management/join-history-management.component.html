<div class="join-history-management-container p-4">
  <!-- Header Section -->
  <div class="header-section">
    <div class="flex justify-content-between align-items-center mb-4">
      <div class="flex align-items-center gap-3">
        <div>
          <h3 class="m-0 title">Lịch sử tham gia</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Section -->
  <div class="search-section mb-3">
    <div class="card search-card" [class.loading-overlay]="loading">
      <div class="card-body p-4">
        <form [formGroup]="form" (ngSubmit)="onSearch()">
          <div class="search-row">
            <!-- Keyword Field -->
            <div class="field-group">
              <label for="keyword" class="field-label">
                <span>Tên cuộc họp</span>
              </label>
              <div class="input-container">
                <p-dropdown
                  [options]="meetingSuggestions"
                  formControlName="keyword"
                  optionLabel="title"
                  [filter]="true"
                  filterBy="title"
                  [showClear]="true"
                  placeholder="Chọn cuộc họp..."
                  (onFilter)="onMeetingFilter($event)"
                  (onShow)="onMeetingDropdownShow()"
                  (onChange)="onMeetingSelect($event)"
                  [style]="{'width': '100%'}"
                  styleClass="input-field">
                </p-dropdown>
              </div>
            </div>

            <!-- Member Name Field -->
            <div class="field-group">
              <label for="memberName" class="field-label">
                <span>Tên thành viên</span>
              </label>
              <div class="input-container">
                <p-dropdown
                  [options]="memberSuggestions"
                  formControlName="memberName"
                  optionLabel="displayLabel"
                  [filter]="true"
                  filterBy="fullName,email,name,displayName"
                  [showClear]="true"
                  placeholder="Tìm theo tên hoặc email..."
                  (onFilter)="onMemberFilter($event)"
                  (onShow)="onMemberDropdownShow()"
                  (onChange)="onMemberSelect($event)"
                  [style]="{'width': '100%'}"
                  styleClass="input-field member-dropdown">
                  <ng-template pTemplate="selectedItem" let-member>
                    <div class="member-selected-item" *ngIf="member">
                      <span class="member-name">{{ member.fullName || member.name || member.displayName || '' }}</span>
                      <span class="member-email" *ngIf="member.email">{{ member.email }}</span>
                    </div>
                  </ng-template>
                  <ng-template pTemplate="item" let-member>
                    <div class="member-dropdown-item">
                      <span class="member-name">{{ member.fullName || member.name || member.displayName || '' }}</span>
                      <span class="member-email" *ngIf="member.email">{{ member.email }}</span>
                    </div>
                  </ng-template>
                </p-dropdown>
              </div>
            </div>

            

            <!-- Start Date Field -->
            <div class="field-group">
              <label for="startDate" class="field-label">               
                <span>Ngày bắt đầu</span>
              </label>
              <div class="input-container">
                <p-calendar 
                  id="startDate"
                  formControlName="startDate"
                  [showTime]="false"
                  dateFormat="dd/mm/yy"
                  placeholder="Chọn ngày bắt đầu"
                  [showIcon]="calendarConfig.showIcon"
                  [iconDisplay]="calendarConfig.iconDisplay"
                  [icon]="calendarConfig.icon"
                  [appendTo]="calendarConfig.appendTo"
                  [touchUI]="calendarConfig.touchUI"
                  [readonlyInput]="calendarConfig.readonlyInput"
                  [showClear]="calendarConfig.showClear"
                  [keepInvalid]="calendarConfig.keepInvalid"
                  [hideOnDateTimeSelect]="calendarConfig.hideOnDateTimeSelect"
                  [showButtonBar]="calendarConfig.showButtonBar"
                  [dataType]="'date'"
                  [manualInput]="true"
                  styleClass="input-field date-field calendar-no-duplicate calendar-fix">
                </p-calendar>
              </div>
            </div>

            <!-- End Date Field -->
            <div class="field-group">
              <label for="endDate" class="field-label">
                <span>Ngày kết thúc</span>
              </label>
              <div class="input-container">
                <p-calendar 
                  id="endDate"
                  formControlName="endDate"
                  [showTime]="false"
                  dateFormat="dd/mm/yy"
                  placeholder="Chọn ngày kết thúc"
                  [showIcon]="calendarConfig.showIcon"
                  [iconDisplay]="calendarConfig.iconDisplay"
                  [icon]="calendarConfig.icon"
                  [appendTo]="calendarConfig.appendTo"
                  [touchUI]="calendarConfig.touchUI"
                  [readonlyInput]="calendarConfig.readonlyInput"
                  [showClear]="calendarConfig.showClear"
                  [keepInvalid]="calendarConfig.keepInvalid"
                  [hideOnDateTimeSelect]="calendarConfig.hideOnDateTimeSelect"
                  [showButtonBar]="calendarConfig.showButtonBar"
                  [dataType]="'date'"
                  [manualInput]="true"
                  styleClass="input-field date-field calendar-no-duplicate calendar-fix">
                </p-calendar>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="actions-group">
              <button
                pButton
                type="button"
                label="Làm mới"
                [disabled]="loading"
                class="p-button-outlined p-button-secondary btn-action custom-refresh-btn"
                (click)="onClear()"
              ></button>
              <button
                pButton
                label="Tìm kiếm"
                type="submit"
                [disabled]="loading"
                [loading]="loading"
                loadingIcon="pi pi-spin pi-spinner"
                class="p-button-primary btn-action custom-search-btn"
              ></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Column Settings Section -->
  <div class="column-settings-section mb-3">
    <div class="flex justify-content-end">
      <button 
        pButton 
        type="button" 
        icon="pi pi-cog"
        label="Tùy chỉnh hiển thị cột"
        class="p-button-outlined p-button-info"
        [style]="{'font-weight': '600', 'border-radius': '8px'}"
        (click)="showColumnSelector = true">
      </button>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-wrapper">
    <app-data-table
      [data]="rows"
      [columns]="displayedColumns"
      [loading]="loading"
      [paginator]="true"
      [paginatorPosition]="'top'"
      [rows]="size"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5,10,25,50]"
      [globalFilterFields]="globalFilterFields"
      (onPage)="onPageChange($event)"
      (onSort)="onSortChange($event)">
    </app-data-table>
  </div>

  <!-- Column Selector Dialog -->
  <p-dialog 
    [(visible)]="showColumnSelector" 
    [modal]="true" 
    [closable]="true" 
    [draggable]="false" 
    [resizable]="false"
    styleClass="column-selector-dialog rounded-dialog"
    [showHeader]="true"
    header="Tùy chỉnh hiển thị cột"
    [style]="{width: '480px', 'max-width': '90vw', 'border-radius': '12px !important', 'border': '2px solid #9ca3af !important', 'overflow': 'hidden'}">
    
    <div class="column-selector-content">
      <div class="column-options-header mb-3">
        <h4 class="mb-2" style="color: #0e7490; font-weight: 600;">
          <i class="pi pi-list mr-2" style="color: #06b6d4;"></i>
          Hiển thị tất cả
        </h4>
        <p class="text-sm text-secondary mb-0">Chọn các cột bạn muốn hiển thị trên bảng dữ liệu</p>
      </div>

      <div class="column-options-grid">
        <div 
          *ngFor="let column of columnConfig" 
          class="column-option-card"
          [class.disabled]="column.alwaysVisible"
          [attr.data-selected]="column.visible && !column.alwaysVisible"
          [style.background]="column.visible && !column.alwaysVisible ? '#e0f7fa !important' : '#ffffff !important'"
          [style.border-color]="column.visible && !column.alwaysVisible ? '#06b6d4 !important' : '#e5e7eb !important'"
          [style.border-width]="column.visible && !column.alwaysVisible ? '2px !important' : '2px !important'"
          [style.box-shadow]="column.visible && !column.alwaysVisible ? '0 2px 8px rgba(6, 182, 212, 0.2) !important' : 'none'"
          (click)="!column.alwaysVisible && toggleColumnVisibility(column)">
          
          <div class="column-option-content">
            <div class="column-icon">
              <i class="pi pi-circle" [class.pi-check-circle]="column.visible" 
                 [style.color]="column.visible ? '#06b6d4' : '#94a3b8'"></i>
            </div>
            <div class="column-info">
              <span class="column-header" 
                    [style.color]="column.visible && !column.alwaysVisible ? '#0e7490 !important' : '#374151 !important'"
                    [style.font-weight]="column.visible && !column.alwaysVisible ? '600 !important' : '600 !important'">{{ column.header }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="column-actions mt-4 pt-3" style="border-top: 1px solid #e5e7eb;">
        <div class="flex justify-content-between align-items-center gap-3">
          <button 
            pButton 
            type="button" 
            label="Đặt lại mặc định"
            class="p-button-outlined dialog-action-btn"
            [style]="{'font-weight': '600', 'border-radius': '6px', 'flex': '1'}"
            (click)="resetColumnVisibility()">
          </button>
          <button 
            pButton 
            type="button" 
            label="Thoát"
            class="p-button-outlined dialog-action-btn"
            [style]="{'font-weight': '600', 'border-radius': '6px', 'flex': '1'}"
            (click)="showColumnSelector = false">
          </button>
        </div>
      </div>
    </div>
  </p-dialog>

  <!-- Loading Dialog -->
  <!-- <p-dialog 
    [(visible)]="loading" 
    [modal]="true" 
    [closable]="false" 
    [draggable]="false" 
    [resizable]="false"
    styleClass="loading-dialog"
    [showHeader]="false">
    <div class="loading-content">
      <div class="loading-spinner">
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem; color: #3498db;"></i>
      </div>
      <div class="loading-text">
        <h4>Đang tìm kiếm...</h4>
        <p>Vui lòng chờ trong giây lát</p>
      </div>
    </div>
  </p-dialog> -->
</div>
